name: Tag release

# Tags master and runs CI against the tag. Releasing is still a deliberate act --
# this is workflow_dispatch, not a push trigger -- but it replaces doing the tag
# dance by hand, and it cannot mis-derive the version or tag the wrong branch.
#
# Pre-releases (vX.Y.Z-rc.1 and friends) are not covered here. Push those tags by
# hand; CI still picks them up on its own.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to increment"
        type: choice
        options:
          - minor
          - major
          - patch
        default: minor

permissions:
  contents: read

jobs:
  tag:
    name: Tag master
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - name: Refuse to release from anything but master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Release must run on master, got ${{ github.ref }}. Re-run and pick master."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Tags are needed to work out what the current version is.
          fetch-depth: 0

      - name: Compute next version
        id: next
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          # Releases have been tagged both as X.Y.Z and vX.Y.Z, so the prefix is
          # stripped before sorting. Only strict release tags seed the next version;
          # pre-release tags sort above the release they precede.
          # `|| true` keeps the fallback below reachable: with pipefail a grep that
          # matches nothing fails the pipeline, and set -e would kill the step
          # before the default could apply.
          latest=$(git tag -l | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n1 || true)
          latest=${latest:-0.0.0}
          IFS=. read -r major minor patch <<<"${latest}"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          version="v${major}.${minor}.${patch}"
          echo "${latest} -> ${version}"
          echo "version=${version}" >>"$GITHUB_OUTPUT"
          {
            echo "### Release \`${version}\`"
            echo ""
            echo "Previous: \`${latest}\` · bump: \`${BUMP}\` · commit: \`${GITHUB_SHA:0:7}\`"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Create and push tag
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          for tag in "${VERSION}" "${VERSION#v}"; do
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "::error::${tag} already exists. Someone tagged out of band."
              exit 1
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"

  ci:
    # A tag pushed with GITHUB_TOKEN does not start another workflow run, so the
    # CI workflow's `on: push: tags` will not fire for the tag created above. CI is
    # therefore called explicitly rather than left to trigger itself. It keeps its
    # push trigger, so a hand-pushed tag still runs.
    name: CI
    needs: tag
    uses: ./.github/workflows/ios-sdk-ci.yml
    secrets: inherit
    with:
      version: ${{ needs.tag.outputs.version }}
